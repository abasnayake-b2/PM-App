spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useSSL=true&allowPublicKeyRetrieval=false&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

dfnpm:
  jwt:
    require-persistent-keys: true
  security:
    swagger-enabled: false
    cookie-secure: true
    cookie-same-site: Strict

management:
  endpoint:
    health:
      show-details: never
