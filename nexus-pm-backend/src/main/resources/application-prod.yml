spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  liquibase:
    # Schema is applied via sql/build.sql + sql/seed.sql
    enabled: false
  datasource:
    url: jdbc:mysql://localhost:3306/dfn_pm?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: Anu@1312anu
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        type:
          preferred_uuid_jdbc_type: CHAR

dfnpm:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://192.168.14.91
      - https://dfnplanx.directfn.net
  security:
    swagger-enabled: true
    cookie-secure: false
    redis-enabled: false
    rate-limit-enabled: false

management:
  health:
    mail:
      enabled: false
    redis:
      enabled: false

logging:
  level:
    root: DEBUG
    com.nexuspm: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.springframework.transaction: DEBUG
    org.springframework.orm.jpa: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.type.descriptor.sql: TRACE
