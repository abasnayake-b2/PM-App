services:
  mysql:
    image: mysql:8.0
    container_name: dfn-pm-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dfn_pm
      MYSQL_USER: dfnpm
      MYSQL_PASSWORD: dfnpm
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: dfn-pm-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./nexus-pm-backend
      dockerfile: Dockerfile
    container_name: dfn-pm-api
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: dfn_pm
      DB_USERNAME: dfnpm
      DB_PASSWORD: dfnpm
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_PRIVATE_KEY_PATH: /app/keys/private.pem
      JWT_PUBLIC_KEY_PATH: /app/keys/public.pem
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  web:
    build:
      context: ./nexus-pm-frontend
      dockerfile: Dockerfile
    container_name: dfn-pm-web
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

  mailhog:
    image: mailhog/mailhog:latest
    container_name: dfn-pm-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  mysql_data:
